# 1) CRD
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xrayapps.medai.mertcolakk.io
spec:
  group: medai.mertcolakk.io
  scope: Namespaced
  names:
    plural: xrayapps
    singular: xrayapp
    kind: XrayApp
    shortNames:
    - xray
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              enablePDB: { type: boolean }
              minAvailable: { type: integer, minimum: 0 }
              enableHPA: { type: boolean }
              replicas: { type: integer, minimum: 0 }
              minReplicas: { type: integer, minimum: 1 }
              maxReplicas: { type: integer, minimum: 1 }
              cpuTarget: { type: integer, minimum: 1 }
              automountServiceAccountToken: { type: boolean }
              port: { type: integer, minimum: 1 }
              serviceType: { type: string }
              serviceName: { type: string }
              image: { type: string }
              imagePullPolicy: { type: string }
              readinessPath: { type: string }
              livenessPath: { type: string }
              addAppArmorAnno: { type: boolean }
              configMapRef: { type: string }
              secretRef: { type: string }
              seccompType: { type: string }
          status:
            type: object
            properties:
              readyReplicas: { type: integer }
---