apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: xray-api
data:
  DB: "xray"
  DB_HOST: "postgres-hl"
  DB_PORT: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-secrets
  namespace: xray-api
immutable: true
type: Opaque
stringData:
  DB_USER: "xray_user"
  DB_PASSWORD: "12345"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: xray-api
  labels:
    protected: "true"
spec:
  serviceName: postgres-hl
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
              name: pg
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            exec: { command: ["sh","-c","pg_isready -U \"$POSTGRES_USER\""] }
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            exec: { command: ["sh","-c","pg_isready -U \"$POSTGRES_USER\""] }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: run
          emptyDir: { medium: Memory }
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-hl
  namespace: xray-api
  labels: { app: postgres }
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: 5432