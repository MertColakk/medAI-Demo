apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xrayapps.medai.mertcolakk.io
spec:
  group: medai.mertcolakk.io
  scope: Namespaced
  names:
    kind: XrayApp
    plural: xrayapps
    singular: xrayapp
    shortNames: ["xapp"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["image"]
              properties:
                image:         { type: string }              
                replicas:      { type: integer, default: 2 }
                port:          { type: integer,  default: 8001 }
                readinessPath: { type: string, default: "/api/readyz" }
                livenessPath:  { type: string, default: "/api/livez" }
                enableHPA:     { type: boolean, default: true }
                minReplicas:   { type: integer, default: 1 }
                maxReplicas:   { type: integer, default: 3 }
                cpuTarget:     { type: integer, default: 70 } 
                addAppArmorAnno:  { type: boolean, default: false } # local off
                automountServiceAccountToken:     { type: boolean, default: false } 
                serviceType:  { type: string, default: "NodePort" }
                serviceName:  { type: string, default: "http" }
                enablePDB:     { type: boolean, default: true }
                minAvailable:   { type: integer, default: 1 }
                configMapRef: { type: string, default: "db-config" }
                secretRef: { type: string, default: "db-secrets" }
                imagePullPolicy: { type: string, default: "IfNotPresent" }
                seccompType:  { type: string, default: "RuntimeDefault" }
                replicaCount:   { type: integer, default: 1 }
            status:
              type: object
              properties:
                readyReplicas: { type: integer }