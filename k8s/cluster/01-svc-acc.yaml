apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sa-automount-disabled
spec:
  validationFailureAction: enforce
  rules:
  - name: pod-sa-automount
    match: { resources: { kinds: ["Pod"], namespaces: ["xray-api"] } }
    mutate:
      patchStrategicMerge:
        spec:
          automountServiceAccountToken: false